<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@500&display=swap"
    />
    <style>
      /* サイトの4色トークン（docs/07-ui.md）。1200x630 = OG画像の標準サイズ */
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #15171d;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .inner {
        text-align: center;
      }
      /**
       * アプリアイコン。**app/icon.png をそのまま参照する。**ここに絵を焼き直すと、
       * アイコンを差し替えたときにOG画像だけ古いまま残る。
       */
      .icon {
        display: block;
        width: 240px;
        height: 240px;
        margin: 0 auto 16px;
      }
      .logo {
        font-family: "Shippori Mincho", serif;
        font-weight: 700;
        font-size: 150px;
        line-height: 1;
        letter-spacing: 0.18em;
        margin-left: 0.18em; /* 字間で末尾に出た余白の分を戻す */
        color: #ece2cf;
      }
      /* 朱の一筆は入れない。朱はアイコンの弧が担う（docs/07-ui.md） */
      .tagline {
        margin-top: 44px;
        font-family: "Zen Kaku Gothic New", sans-serif;
        font-weight: 500;
        font-size: 32px;
        letter-spacing: 0.2em;
        color: rgba(236, 226, 207, 0.75);
      }
    </style>
  </head>
  <body>
    <div class="inner">
      <img class="icon" src="../apps/frontend/app/icon.png" alt="" />
      <div class="logo">HENGE</div>
      <div class="tagline">お題が毎回生まれる、日本語タイピングの修行場</div>
    </div>
  </body>
</html>
