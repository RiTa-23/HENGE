name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # デプロイ前にもう一度検査する。PRの後にmainが進んでいる場合を拾うため。
  check:
    uses: ./.github/workflows/ci.yml

  # **マイグレーションはデプロイの前に適用する。** 逆順にすると、新しいスキーマを
  # 前提にしたコードが古いテーブルの上で動く時間ができる。
  migrate:
    needs: check
    runs-on: ubuntu-latest
    # 手動の migrate.yml と同じグループにして直列化する。
    # 同じDBに2つのワークフローが同時に触らないようにするため。
    concurrency:
      group: d1-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # 何を適用しようとしたかを先に残す。落ちたときに「何が起きるはずだったか」が分かる
      - name: 未適用の一覧（適用前）
        id: before
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          packageManager: bun
          command: d1 migrations list henge-db --remote

      - name: 適用
        id: apply
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          packageManager: bun
          command: d1 migrations apply henge-db --remote

      # **適用できたことを確かめる。** D1のマイグレーションはサイレントに失敗する
      # 報告があり、apply の終了コードだけでは信用できない。手動フローで人が結果を
      # 見ていた役割を、ここで機械が代わりに果たす。
      - name: 未適用の一覧（適用後）
        id: after
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          packageManager: bun
          command: d1 migrations list henge-db --remote

      - name: 未適用が残っていたら失敗させる
        env:
          AFTER_OUTPUT: ${{ steps.after.outputs.command-output }}
          AFTER_STDERR: ${{ steps.after.outputs.command-stderr }}
        run: |
          if ! printf '%s%s' "$AFTER_OUTPUT" "$AFTER_STDERR" | grep -q "No migrations to apply"; then
            echo "::error::適用後も未適用のマイグレーションが残っている。デプロイを止める"
            exit 1
          fi

      # 何が起きたかを必ず残す。失敗時も残す。
      - name: 実行結果をサマリに出す
        if: always()
        env:
          BEFORE_OUTPUT: ${{ steps.before.outputs.command-output }}
          APPLY_OUTPUT: ${{ steps.apply.outputs.command-output }}
          APPLY_STDERR: ${{ steps.apply.outputs.command-stderr }}
          AFTER_OUTPUT: ${{ steps.after.outputs.command-output }}
        run: |
          {
            echo "## D1 migrate (henge-db / remote)"
            echo
            echo "### 適用前の未適用"
            echo '```'
            echo "$BEFORE_OUTPUT"
            echo '```'
            echo "### 適用"
            echo '```'
            echo "$APPLY_OUTPUT"
            echo "$APPLY_STDERR"
            echo '```'
            echo "### 適用後の未適用"
            echo '```'
            echo "$AFTER_OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # マイグレーションが失敗したらデプロイしない。**古いスキーマの上で新しい
    # コードを動かさない**ことが、順序を分けている理由そのもの。
    needs: [check, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # backend を先にデプロイする。frontend の Service Binding が
      # henge-backend を参照するため、順序を入れ替えない。
      - name: Deploy backend (Hono Worker)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          packageManager: bun
          command: deploy

      - name: Build frontend (OpenNext)
        run: bun run --cwd apps/frontend build:worker

      - name: Deploy frontend (Next.js Worker)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/frontend
          packageManager: bun
          command: deploy

# D1のマイグレーションは上の migrate ジョブで自動適用する。
# migrate.yml（手動トリガー）は調査と復旧のために残してある。
