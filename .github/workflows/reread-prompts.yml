name: Reread prompts

# unidic-cwj-trim の release-user-lex.yml から、user-lex.csv の
# Releaseアセット差し替え直後に workflow_dispatch で起動される。
# prompts.reading_kana は生成時点で凍結されるので、辞書が変わるたびに
# 既存お題を新辞書で再読みして差分を prod D1 に適用する。
on:
  workflow_dispatch:

concurrency:
  group: reread-prompts
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  reread:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: Fetch reading dictionary (UniDic trim)
        run: bun run --cwd apps/reading dict:fetch

      - name: Start reading worker (wrangler dev)
        run: |
          (cd apps/reading && bunx wrangler dev --port 8787 > /tmp/reading-dev.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8787/health || (cat /tmp/reading-dev.log && exit 1)

      - name: Reread prompts and apply diffs to D1
        run: bun scripts/maintenance/reread-prompts.ts --remote --apply --out "$RUNNER_TEMP/reread"

      - name: Upload changes report
        uses: actions/upload-artifact@v4
        with:
          name: reread-changes-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reread/changes.tsv
            ${{ runner.temp }}/reread/updates.sql
          retention-days: 30
          if-no-files-found: warn
