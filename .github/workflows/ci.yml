name: CI

on:
  pull_request:
    branches: [main]
  # deploy.yml から呼ぶ。マージ後の状態で検査を通してからデプロイする。
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: lint (oxlint)
        run: bun run lint

      - name: format (oxfmt)
        run: bun run format:check

      - name: typecheck (tsc)
        run: bun run typecheck

      # bun test を直接呼ばない。対象ディレクトリの指定は package.json の
      # test スクリプトが持っており、素の bun test はリポジトリ全体を走査して
      # apps/backend の Workersテスト（cloudflare:test に依存）まで拾ってしまう
      - name: test (純粋関数)
        run: bun run test

      # vitest.config.ts で remoteBindings: false にしているため、
      # Cloudflareの認証情報なしで実行できる（forkからのPRでも動く）。
      - name: test:workers (D1 / KV 依存)
        run: bun run test:workers
