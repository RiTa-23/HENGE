name: D1 migrate

# 通常の適用は deploy.yml の migrate ジョブが自動で行う（mainへのマージで走る）。
# **こちらは調査と復旧のための手動の入口。** 何が未適用かを見たいとき（list）、
# 自動適用が落ちた後に手で流し直したいとき（apply）に使う。
# deploy.yml の migrate ジョブと同じ concurrency グループで直列化してあり、
# 同じDBに同時に触ることはない。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = 未適用の一覧を見るだけ / apply = 実際に適用する"
        type: choice
        options: [list, apply]
        default: list
        required: true

concurrency:
  group: d1-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      - name: d1 migrations ${{ inputs.mode }} (henge-db / remote)
        id: migrate
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          packageManager: bun
          command: d1 migrations ${{ inputs.mode }} henge-db --remote

      # 何が起きたかを必ず残す。失敗時も残す。
      - name: 実行結果をサマリに出す
        if: always()
        env:
          COMMAND_OUTPUT: ${{ steps.migrate.outputs.command-output }}
          COMMAND_STDERR: ${{ steps.migrate.outputs.command-stderr }}
        run: |
          {
            echo "## d1 migrations ${{ inputs.mode }} (henge-db / remote)"
            echo
            echo '```'
            echo "$COMMAND_OUTPUT"
            echo "$COMMAND_STDERR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
