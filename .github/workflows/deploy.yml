name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # デプロイ前にもう一度検査する。PRの後にmainが進んでいる場合を拾うため。
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # backend を先にデプロイする。frontend の Service Binding が
      # henge-backend を参照するため、順序を入れ替えない。
      - name: Deploy backend (Hono Worker)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          packageManager: bun
          command: deploy

      - name: Build frontend (OpenNext)
        run: bun run --cwd apps/frontend build:worker

      - name: Deploy frontend (Next.js Worker)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/frontend
          packageManager: bun
          command: deploy

# D1のマイグレーションはここでは適用しない。migrate.yml（手動トリガー）で行う。
