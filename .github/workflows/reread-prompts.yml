name: Reread prompts

# 既存お題を新しいユーザー辞書で再読みし、差分を prod D1 に適用する。
# prompts.reading_kana は生成時点で凍結されるので、辞書が変わるたびに走らせる。
#
# **Deploy のあとに走らせる。** Deploy は CI（読み Worker のテストを含む）とデプロイが
# 通ってから、**毎回**このワークフローを呼ぶ。CI より先に本番 D1 を書き換えない。
#
# **再読みするかは、取得した辞書と user-lex.csv のハッシュで決める。** 最後に再読みを終えた
# 辞書・csv のハッシュを Actions のキャッシュのキーとして残し、同じならすぐ終わる。
# 辞書も入れるのは、システム辞書だけを差し替えたとき（fetch-dict.ts のタグ・sha256 の変更）にも
# 再読みを走らせるため。user-lex.csv だけで決めると、辞書が変わっても再読みされない。
# 辞書リポジトリからの起動（Deploy の `reread: true`）だけを合図にすると、その Deploy が
# 待機中に次の push の Deploy に置き換えられたとき（同じ concurrency グループで待機できる
# のは1本だけ）、再読みが黙って消える。ハッシュで決めれば、次のどの Deploy でも拾い直せる。
# キャッシュが消えても（7日間使われないと消える）、同じ辞書での再読みは差分0で終わるだけ。
#
# 手動でも起動できる（調査・やり直し用。既定でハッシュに関わらず走らせる）。
on:
  workflow_call:
    inputs:
      force:
        description: "辞書・user-lex.csv が前回の再読みから変わっていなくても走らせる"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force:
        description: "辞書・user-lex.csv が前回の再読みから変わっていなくても走らせる"
        type: boolean
        default: true

jobs:
  reread:
    runs-on: ubuntu-latest
    # 本番 D1 に書き込むので、マイグレーション（deploy.yml / migrate.yml）と直列にする
    concurrency:
      group: d1-migrate
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # 取得スクリプトは node の組み込みしか使わないので、bun install の前に回せる
      - name: Fetch reading dictionary (UniDic trim)
        run: bun run --cwd apps/reading dict:fetch

      - name: 辞書と user-lex.csv のハッシュ
        id: lex
        run: echo "sha=$(cat apps/reading/assets/unidic.dic.zst apps/reading/assets/user-lex.csv | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"

      # 中身は要らない。キーがあるか（=この csv で再読みを終えたか）だけを見る
      - name: この辞書で再読み済みか
        id: done
        uses: actions/cache/restore@v4
        with:
          path: .reread-done
          key: reread-dict-${{ steps.lex.outputs.sha }}
          lookup-only: true

      - name: 再読み済みなので終える
        if: steps.done.outputs.cache-hit == 'true' && !inputs.force
        run: echo "辞書と user-lex.csv（${{ steps.lex.outputs.sha }}）では再読み済み。何もしない"

      - if: steps.done.outputs.cache-hit != 'true' || inputs.force
        run: bun install --frozen-lockfile

      # apps/reading の dev スクリプトと同じポート（8788）。再読みスクリプトの既定もこれに合わせてある
      - name: Start reading worker (wrangler dev)
        if: steps.done.outputs.cache-hit != 'true' || inputs.force
        run: |
          (bun run --cwd apps/reading dev > /tmp/reading-dev.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:8788/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8788/health || (cat /tmp/reading-dev.log && exit 1)

      - name: Reread prompts and apply diffs to D1
        if: steps.done.outputs.cache-hit != 'true' || inputs.force
        run: bun scripts/maintenance/reread-prompts.ts --remote --apply --out "$RUNNER_TEMP/reread"

      - name: Upload changes report
        if: always() && (steps.done.outputs.cache-hit != 'true' || inputs.force)
        uses: actions/upload-artifact@v4
        with:
          name: reread-changes-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reread/changes.tsv
            ${{ runner.temp }}/reread/skipped.tsv
            ${{ runner.temp }}/reread/updates.sql
          retention-days: 30
          if-no-files-found: warn

      # **適用が通ったときだけ**「この辞書で再読み済み」を残す。落ちたら次の Deploy でやり直す
      - name: 再読み済みの印を残す
        if: steps.done.outputs.cache-hit != 'true'
        run: echo "${{ steps.lex.outputs.sha }}" > .reread-done

      - if: steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .reread-done
          key: reread-dict-${{ steps.lex.outputs.sha }}
